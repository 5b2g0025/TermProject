<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraWall | 質感社群貼文牆</title>
  <meta name="description" content="AuraWall 是一個具備極致美感與磨砂玻璃風格的社群貼文牆，支援動態點讚、即時留言、標籤篩選與雙色主題切換。">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-container" id="app-main-container">

    <aside class="sidebar">

      <div class="brand-section">
        <div class="logo-circle">A</div>
        <span class="brand-name">AuraWall</span>
      </div>

      <div class="profile-card glass-panel">
        <div class="avatar-wrapper">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"
            alt="用戶頭像" class="user-avatar-lg" id="profile-avatar-img">
          <button class="btn-edit-avatar" id="btn-edit-avatar" title="編輯個人檔案"><i
              class="fa-solid fa-pen-to-square"></i></button>
        </div>
        <h2 class="profile-name" id="profile-display-name">
          Aura User
          <i class="fa-solid fa-circle-check badge-official" title="已驗證用戶"></i>
        </h2>
        <span class="profile-handle" id="profile-display-handle">@aura_explorer</span>

        <div class="profile-stats">
          <div class="stat-item">
            <span class="stat-val" id="stats-posts-count">0</span>
            <span class="stat-lbl">貼文</span>
          </div>
          <div class="stat-item">
            <span class="stat-val" id="stats-likes-count">0</span>
            <span class="stat-lbl">粉絲</span>
          </div>
          <div class="stat-item stat-clickable" id="stats-following-card" title="點擊查看你追蹤的創作者">
            <span class="stat-val" id="stats-bookmarks-count">0</span>
            <span class="stat-lbl">追蹤</span>
          </div>
        </div>
      </div>
      <nav class="sidebar-menu glass-panel">
        <button class="menu-item active" id="menu-feed">
          <i class="fa-solid fa-house"></i>
          <span>動態牆</span>
        </button>
        <button class="menu-item" id="menu-chat">
          <i class="fa-solid fa-comments"></i>
          <span>私訊聊天</span>
        </button>
        <button class="menu-item" id="menu-bookmarks">
          <i class="fa-solid fa-bookmark"></i>
          <span>我的收藏</span>
        </button>
        <button class="menu-item" id="menu-about">
          <i class="fa-solid fa-circle-info"></i>
          <span>關於本站</span>
        </button>
        <button class="menu-item" id="menu-admin" style="display: none;">
          <i class="fa-solid fa-gauge-high"></i>
          <span>後台管理</span>
        </button>
        <button class="menu-item" id="menu-auth">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span id="menu-auth-text">會員登入 / 註冊</span>
        </button>
      </nav>
      <div class="footer-widget glass-panel">
        <span class="theme-switch-title">深色模式</span>
        <button class="btn-toggle-theme" id="btn-theme-toggle" aria-label="切換主題">
          <div class="theme-slider-thumb">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
          </div>
        </button>
      </div>

    </aside>

    <main class="main-content">

      <header class="main-header">
        <div class="header-top">
          <div class="header-title-wrapper">
            <h1 id="feed-title">精彩動態</h1>
            <p id="feed-subtitle">探索社群的最新靈感與精彩瞬間</p>
          </div>

          <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="搜尋貼文內容、作者..." class="search-input" id="search-input">
          </div>
        </div>

        <div class="filter-tabs-row">
          <div class="filter-tabs" id="filter-tabs-container">
            <button class="tab-btn active" id="tab-latest">最新貼文</button>
            <button class="tab-btn" id="tab-popular">熱門排行</button>
          </div>

          <div class="active-filter-badge" id="active-filter-badge">
            <span>正在篩選: <strong id="active-filter-text">#Design</strong></span>
            <button id="btn-clear-filter" title="清除篩選"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>
      </header>

      <div class="create-post-card glass-panel" id="create-post-area">
        <div class="create-post-header">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"
            alt="使用者頭像" class="user-avatar-sm" id="post-creator-avatar">
          <div class="post-textarea-wrapper">
            <textarea placeholder="分享今天的新新鮮事與美好靈感..." class="create-post-textarea" id="post-input-text"></textarea>
          </div>
        </div>

        <div class="create-post-attachments">

          <div class="image-preview-container" id="image-preview-box">
            <img src="" alt="預覽圖片" class="image-preview-img" id="image-preview-img">
            <button class="btn-remove-preview" id="btn-remove-image-preview" title="移除圖片">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <div class="post-tags-input-container" id="post-tags-input-container">
            <input type="text" placeholder="+ 新增標籤 (按下 Enter)" class="input-add-tag" id="input-add-tag">
          </div>

        </div>

        <div class="create-post-footer">
          <div class="post-tools">
            <button class="tool-btn" id="btn-trigger-image-popup" data-tooltip="添加圖片">
              <i class="fa-regular fa-image"></i>
            </button>
            <input type="file" id="file-upload-input" accept="image/*" style="display: none;">

            <button class="tool-btn" id="btn-trigger-emoji-popup" data-tooltip="插入表情符號">
              <i class="fa-regular fa-face-smile"></i>
            </button>
          </div>

          <button class="btn-publish" id="btn-publish-post">
            <i class="fa-solid fa-paper-plane"></i>
            <span>發佈動態</span>
          </button>
        </div>
        <!-- 圖片 URL 彈出視窗 -->
        <div class="image-url-popup" id="image-url-popup" role="dialog" aria-modal="false" aria-hidden="true"
          aria-labelledby="image-url-popup-title" tabindex="-1">
          <div class="url-popup-header">
            <h4 id="image-url-popup-title">插入圖片網址</h4>
            <button class="btn-close-modal" id="btn-close-url-popup" aria-label="關閉圖片網址輸入"><i
                class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="url-input-row">
            <input type="text" id="input-image-url" placeholder="https://...">
            <button class="btn-popup-confirm" id="btn-confirm-image-url">加入</button>
          </div>
          <div class="random-images-grid" id="random-preset-grid"></div>
        </div>

        <!-- 表情符號彈出視窗 -->
        <div class="emoji-picker-popup" id="emoji-picker-popup" role="dialog" aria-modal="false" aria-hidden="true"
          aria-labelledby="emoji-picker-title" tabindex="-1">
          <div class="emoji-picker-header">
            <span class="emoji-picker-title" id="emoji-picker-title">選擇表情符號</span>
            <div class="emoji-category-tabs" id="emoji-category-tabs"></div>
            <button class="btn-close-modal" id="btn-close-emoji-popup" aria-label="關閉表情符號選單"><i
                class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="emoji-grid" id="emoji-grid"></div>
        </div>

      </div>

      <section class="posts-feed-container" id="posts-feed">
      </section>

    </main>

    <aside class="widgets">

      <div class="widget-card glass-panel">
        <h3 class="widget-title">
          <i class="fa-solid fa-chart-line" style="color: var(--tag-text);"></i>
          社群看板數據
        </h3>
        <div class="widget-stats-grid">
          <div class="widget-stat-card">
            <span class="widget-stat-num" id="total-platform-posts">0</span>
            <span class="widget-stat-lbl">全站貼文數</span>
          </div>
          <div class="widget-stat-card">
            <span class="widget-stat-num" id="total-platform-likes">0</span>
            <span class="widget-stat-lbl">累積按讚次數</span>
          </div>
        </div>
      </div>

      <div class="widget-card glass-panel">
        <h3 class="widget-title">
          <i class="fa-solid fa-fire" style="color: #ff7e40;"></i>
          熱門社群標籤
        </h3>
        <div class="tag-cloud" id="hot-tags-cloud">
        </div>
      </div>

      <div class="widget-card glass-panel">
        <h3 class="widget-title">
          <i class="fa-solid fa-user-plus" style="color: #10b981;"></i>
          推薦追蹤
        </h3>
        <div class="who-to-follow-list" id="recommendations-list">
        </div>
      </div>

    </aside>

  </div>

  <!-- 會員登入 / 註冊彈出視窗 -->
  <div class="auth-container" id="auth-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="會員登入或註冊視窗"
    tabindex="-1" style="display: none;">
    <div class="auth-card glass-panel">
      <!-- 關閉按鈕 -->
      <button class="btn-close-modal" id="btn-close-auth" aria-label="關閉登入視窗"
        style="position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: var(--input-bg); transition: all var(--transition-fast);">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="auth-header">
        <div class="logo-circle">A</div>
        <span class="brand-name">AuraWall</span>
      </div>
      <p class="auth-subtitle">探索極致美感與精彩貼文牆</p>

      <!-- 頁籤切換 -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login-btn">會員登入</button>
        <button class="auth-tab-btn" id="tab-register-btn">新用戶註冊</button>
      </div>

      <!-- 登入表單 -->
      <form class="auth-form" id="login-form">
        <div class="input-with-icon">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" placeholder="電子信箱 Email" id="login-email" required>
        </div>
        <div class="input-with-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="密碼 Password" id="login-password" required>
        </div>
        <button type="submit" class="btn-auth-submit">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>登入系統</span>
        </button>
      </form>

      <!-- 註冊表單 -->
      <form class="auth-form" id="register-form" style="display: none;">
        <div class="input-with-icon">
          <i class="fa-regular fa-user"></i>
          <input type="text" placeholder="顯示名稱 Username" id="register-username" required>
        </div>
        <div class="input-with-icon">
          <i class="fa-solid fa-at"></i>
          <input type="text" placeholder="用戶帳號 Handle (例如: @explorer)" id="register-handle" required>
        </div>
        <div class="field-error-msg" id="register-handle-error"></div>
        <div class="input-with-icon">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" placeholder="電子信箱 Email" id="register-email" required>
        </div>
        <div class="field-error-msg" id="register-email-error"></div>
        <div class="input-with-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="設定密碼 Password" id="register-password" required>
        </div>
        <input type="file" id="avatar-upload" accept="image/*" style="display: none;">

        <label
          style="font-size: 13px; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 8px; margin-top: 4px;">選擇你的頭像</label>
        <div class="avatar-selection-container">
          <label class="avatar-option active" data-avatar-url="https://cdn2.ettoday.net/images/1161/d1161122.jpg">
            <input type="radio" name="avatar" value="dog" checked>
            <img src="https://cdn2.ettoday.net/images/1161/d1161122.jpg" alt="狗">
          </label>

          <label class="avatar-option"
            data-avatar-url="https://i.pinimg.com/736x/b6/c2/35/b6c23505a33a6674c1ecd418615ed257.jpg">
            <input type="radio" name="avatar" value="cat">
            <img src="https://i.pinimg.com/736x/b6/c2/35/b6c23505a33a6674c1ecd418615ed257.jpg" alt="貓">
          </label>

          <label class="avatar-option"
            data-avatar-url="https://img.touxiangkong.com/uploads/allimg/2021082922/ac4myvzq54k.jpg">
            <input type="radio" name="avatar" value="rabbit">
            <img src="https://img.touxiangkong.com/uploads/allimg/2021082922/ac4myvzq54k.jpg" alt="兔子">
          </label>

          <label class="avatar-option custom-upload" id="upload-trigger" for="avatar-upload">
            <input type="radio" name="avatar" value="custom" id="custom-avatar-radio">
            <div class="upload-icon-box" id="upload-plus-icon" style="display: flex; align-items: center; justify-content: center;">
              <i class="fa-solid fa-camera"></i>
            </div>
            <img src="" alt="上傳自訂頭像" id="custom-avatar-preview"
              style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
          </label>
        </div>

        <button type="submit" class="btn-auth-submit">
          <i class="fa-solid fa-user-plus"></i>
          <span>註冊新帳戶</span>
        </button>
      </form>

      <!-- 分隔線與第三方登入 -->
      <div class="social-login-section" id="social-login-section"
        style="display: block; width: 100%; margin-top: 24px; text-align: center;">
        <div
          style="display: flex; align-items: center; margin-bottom: 16px; color: var(--text-muted); font-size: 12px;">
          <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
          <span style="padding: 0 10px;">或使用社群帳號登入</span>
          <div style="flex: 1; height: 1px; background: var(--glass-border);"></div>
        </div>
        <div class="social-buttons-container" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Google Login -->
          <button class="btn-social-google" id="btn-login-google" type="button">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google logo"
              style="width: 18px; height: 18px;">
            <span>使用 Google 帳號登入</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- 編輯個人資訊 Modal -->
  <div class="modal-overlay" id="profile-edit-modal" role="dialog" aria-modal="true" aria-hidden="true"
    aria-labelledby="profile-edit-modal-title" tabindex="-1" style="display:none;">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3 id="profile-edit-modal-title">編輯個人檔案</h3>
        <button class="btn-close-modal" id="btn-close-profile-edit" aria-label="關閉編輯個人檔案視窗"><i
            class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:12px;align-items:center;">
          <img src="" id="profile-edit-avatar-preview" class="user-avatar-lg"
            style="width:72px;height:72px;border-radius:50%;">
          <div style="flex:1; display:flex; flex-direction:column; gap:14px;">
            <div class="profile-edit-field">
              <label>顯示名稱</label>
              <input type="text" id="input-edit-username" placeholder="顯示名稱">
            </div>
            <div class="profile-edit-field">
              <label>用戶 ID </label>
              <input type="text" id="input-edit-handle" placeholder="@your_handle">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>選擇你的頭像</label>
          <div class="avatar-selection-container" id="edit-avatar-selection">
            <label class="avatar-option" data-avatar-url="https://cdn2.ettoday.net/images/1161/d1161122.jpg">
              <input type="radio" name="edit-avatar" value="preset-0">
              <img src="https://cdn2.ettoday.net/images/1161/d1161122.jpg" alt="頭像 1">
            </label>
            <label class="avatar-option"
              data-avatar-url="https://i.pinimg.com/736x/b6/c2/35/b6c23505a33a6674c1ecd418615ed257.jpg">
              <input type="radio" name="edit-avatar" value="preset-1">
              <img src="https://i.pinimg.com/736x/b6/c2/35/b6c23505a33a6674c1ecd418615ed257.jpg" alt="頭像 2">
            </label>
            <label class="avatar-option"
              data-avatar-url="https://img.touxiangkong.com/uploads/allimg/2021082922/ac4myvzq54k.jpg">
              <input type="radio" name="edit-avatar" value="preset-2">
              <img src="https://img.touxiangkong.com/uploads/allimg/2021082922/ac4myvzq54k.jpg" alt="頭像 3">
            </label>
            <label class="avatar-option custom-upload" for="edit-avatar-upload">
              <input type="radio" name="edit-avatar" value="custom" id="edit-custom-avatar-radio">
              <div class="upload-icon-box" id="edit-upload-plus-icon" style="display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-camera"></i>
              </div>
              <img src="" alt="上傳自訂頭像" id="edit-custom-avatar-preview"
                style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
            </label>
          </div>
          <input type="file" id="edit-avatar-upload" accept="image/*" style="display: none;">
        </div>

        <div class="form-group">
          <label>上方色帶顏色</label>
          <div id="profile-color-options" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-cancel" id="btn-cancel-profile-edit">取消</button>
        <button class="btn-modal-save" id="btn-save-profile-edit">儲存變更</button>
      </div>
    </div>
  </div>

  <!-- 未登入提示 Modal -->
  <div class="modal-overlay" id="login-required-modal" role="dialog" aria-modal="true" aria-hidden="true"
    aria-labelledby="login-required-modal-title" tabindex="-1" style="display:none;">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3 id="login-required-modal-title">請先登入</h3>
        <button class="btn-close-modal" id="btn-close-login-required" aria-label="關閉登入提示視窗"><i
            class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <p style="color:var(--text-main);">您需要先登入帳戶才能編輯個人資料、按讚、留言、收藏、發佈動態、追蹤。</p>
      </div>
      <div class="modal-footer">
        <button class="btn-modal-cancel" id="btn-login-required-cancel">取消</button>
        <button class="btn-modal-save" id="btn-open-auth-from-login-required">前往登入</button>
      </div>
    </div>
  </div>

  <!-- 追蹤清單 Modal -->
  <div class="modal-overlay" id="following-modal" role="dialog" aria-modal="true" aria-hidden="true"
    aria-labelledby="following-modal-title" tabindex="-1" style="display:none;">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3 id="following-modal-title">你追蹤的人</h3>
        <button class="btn-close-modal" id="btn-close-following-modal" aria-label="關閉追蹤清單視窗"><i
            class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="following-modal-body" style="max-height:60vh;overflow:auto;"></div>
    </div>
  </div>

  <!-- 作者貼文檢視 Modal -->
  <div class="modal-overlay" id="author-modal" role="dialog" aria-modal="true" aria-hidden="true"
    aria-labelledby="author-modal-title" tabindex="-1" style="display:none;">
    <div class="modal-content glass-panel">
      <div class="modal-header">
        <h3 id="author-modal-title">作者貼文</h3>
        <button class="btn-close-modal" id="btn-close-author-modal" aria-label="關閉作者貼文視窗"><i
            class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="author-modal-body" style="max-height:60vh;overflow:auto;"></div>
    </div>
  </div>

  <!-- 私訊聊天室 Widget -->
  <div class="chat-widget-container" id="chat-widget" style="display: none;">
    <!-- 收合狀態的浮動按鈕 -->
    <button class="chat-trigger-btn glass-panel" id="chat-trigger-btn">
      <i class="fa-regular fa-comments"></i>
      <span class="chat-trigger-text">私訊聊天</span>
      <span class="chat-unread-badge" id="chat-unread-badge" style="display: none;"></span>
    </button>

    <!-- 展開狀態的聊天面板 -->
    <div class="chat-panel glass-panel" id="chat-panel" style="display: none;">
      <div class="chat-panel-header">
        <div class="chat-target-info">
          <img src="" alt="avatar" class="chat-target-avatar" id="chat-target-avatar">
          <div class="chat-target-meta">
            <span class="chat-target-name" id="chat-target-name">未選取聯絡人</span>
            <span class="chat-target-handle" id="chat-target-handle"></span>
          </div>
        </div>
        <div class="chat-header-actions">
          <button class="chat-btn-close" id="btn-close-chat" title="最小化聊天室">
            <i class="fa-solid fa-minus"></i>
          </button>
        </div>
      </div>

      <!-- 訊息歷史 -->
      <div class="chat-messages-body" id="chat-messages-body">
        <div class="chat-empty-state">
          <i class="fa-regular fa-paper-plane"></i>
          <p>點擊動態牆上的「私訊」按鈕<br>開始與創作者進行私密對話 ✨</p>
        </div>
      </div>

      <!-- 輸入框區域 -->
      <form class="chat-input-area" id="chat-input-form">
        <input type="text" placeholder="輸入訊息..." class="chat-input" id="chat-input-text-field" required autocomplete="off">
        <button type="submit" class="chat-btn-send" id="btn-send-chat-msg" title="發送訊息">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase Compat SDKs (v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="app.js"></script>
</body>
